<div class="sidebar">
  <div class="sidebar-header">
    <div class="logo">
      <mat-icon>water_drop</mat-icon>
      <span>BMS</span>
    </div>
    <div class="user-info" *ngIf="currentUser">
      <div class="avatar">{{ currentUser.username?.charAt(0)?.toUpperCase() }}</div>
      <div class="user-details">
        <span class="username">{{ currentUser.username }}</span>
        <span class="role">{{ currentUser.role }}</span>
      </div>
    </div>
  </div>

  <mat-divider class="sidebar-divider"></mat-divider>

  <nav class="sidebar-nav">
    <ng-container *ngFor="let item of visibleItems">
      <mat-divider *ngIf="item.divider" class="nav-divider"></mat-divider>
      <a
        [routerLink]="item.route"
        routerLinkActive="active"
        class="nav-item"
        [class.active]="isActive(item.route)"
        mat-ripple>
        <mat-icon>{{ item.icon }}</mat-icon>
        <span>{{ item.label }}</span>
        <span *ngIf="item.badge" class="nav-badge">{{ item.badge }}</span>
      </a>
    </ng-container>
  </nav>

  <div class="sidebar-footer">
    <div class="version">v1.0.0 &bull; Blood Management System</div>
  </div>
</div>
