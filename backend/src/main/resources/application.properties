# Application
spring.application.name=blood-management-system
server.port=8080
server.servlet.context-path=/api

# MySQL Database
spring.datasource.url=jdbc:mysql://localhost:3306/blood_management?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=your_password
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# JWT — Session Management
# All API calls require a valid Bearer token in the Authorization header.
# Tokens are signed HS256 and expire after 24 hours (86400000 ms).
app.jwt.secret=BloodManagementSystemSecretKeyForJWTTokenSigningMustBeLongEnough2024
app.jwt.expiration-ms=86400000

# CORS
app.cors.allowed-origins=http://localhost:4200

# ── Razorpay Payment Integration ─────────────────────────────────────────────
# Add your actual keys from: https://dashboard.razorpay.com -> Settings -> API Keys
# Use rzp_test_* keys for development and rzp_live_* keys for production.
razorpay.key.id=rzp_test_REPLACE_WITH_YOUR_KEY_ID
razorpay.key.secret=REPLACE_WITH_YOUR_KEY_SECRET
# ─────────────────────────────────────────────────────────────────────────────

# Logging
logging.level.com.bloodmanagement=DEBUG
logging.level.org.springframework.security=INFO

# Pagination
spring.data.web.pageable.default-page-size=20
spring.data.web.pageable.max-page-size=100
